# 历史 /xs/ 部署的替代片段，不是当前根路径部署的附加文件！
# 当前 dsxnb.conf 的 /xs/ 属于 Node:3000；禁止直接合并，否则冲突/覆盖该路由。
# 仅在确实采用 /xs/ 部署的 HTTPS server {} 内包含本片段一次。
# 宿主 http {} 必须先定义（已有同名 zone 则不重复）：
# limit_req_zone $binary_remote_addr zone=eggworld_auth:10m rate=1r/s;
# 不要把本片段放入 conf.d/*.conf 的 http 级通配 include。
# 保留宿主 ACME challenge 的原路径；若宿主有 ^~ 静态 location，先消除正则绕过。
# 发布须另行授权；此文件未部署。
    # server 级统一添加；location 内勿另加 add_header，否则整组不再继承。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 仅观察：不强制阻止当前内联脚本/样式；无报告接收端，先用浏览器控制台观察。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    client_max_body_size 2m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req_status 429;

    # 普通 prefix location 保持可被安全正则覆盖；不要改为 ^~。
    # 仅豁免完整 .well-known 路径段（保留 ACME），不是 .well-known-anything。
    location ~ /\.(?!well-known(?:/|$)) { deny all; }
    location ~* \.(?:env|ini|conf|ya?ml|properties|sql|bak|backup|old|orig|save|swp|swo|log|pem|key|p12|pfx|jks|keystore|zip|tar|gz|tgz|7z|rar)(?:/|$) { deny all; }
    location ~ ~$ { deny all; }

    # ===== 蛋蛋世界（部署于 /xs/）=====
    location = /xs { return 301 /xs/; }

    # 前端静态文件（index.html + 角色图片放 /home/xiaos/eggworld/xs/）
    location /xs/ {
        alias /home/xiaos/eggworld/xs/;
        index index.html;
        try_files $uri $uri/ /xs/index.html;
    }

    location /xs/api/auth/ {
        limit_req zone=eggworld_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
    # 后端 API 反代 → 本地 8090（8080 被 love-api 占用）
    # 宿舍图片上传：最多 5 张 × 5 MB，放宽请求体上限但不影响其他 API。
    location = /xs/api/dormitories {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8090/api/dormitories;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
    location /xs/api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
