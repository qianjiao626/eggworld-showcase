# 必须在 nginx.conf 的 http {} 中 include 本文件（不是 server {}）。
# 同名 zone 全局只定义一次；按连接端 IP 限流，不信任客户端伪造的转发头。
limit_req_zone $binary_remote_addr zone=eggworld_auth:10m rate=1r/s;

server {
    listen 80;
    server_name www.dsxnb.com;
    return 301 https://dsxnb.com$request_uri;
}

server {
    listen 80;
    server_name dsxnb.com;
    return 301 https://dsxnb.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.dsxnb.com;

    ssl_certificate /etc/letsencrypt/live/dsxnb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsxnb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # server 级统一添加；location 内勿另加 add_header，否则整组不再继承。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 仅观察：不强制阻止当前内联脚本/样式；无报告接收端，先用浏览器控制台观察。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    return 301 https://dsxnb.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dsxnb.com;

    ssl_certificate /etc/letsencrypt/live/dsxnb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsxnb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # server 级统一添加；location 内勿另加 add_header，否则整组不再继承。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 仅观察：不强制阻止当前内联脚本/样式；无报告接收端，先用浏览器控制台观察。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    client_max_body_size 2m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req_status 429;

    # 普通 prefix location 保持可被安全正则覆盖；不要改为 ^~。
    # 仅豁免完整 .well-known 路径段（保留 ACME），不是 .well-known-anything。
    location ~ /\.(?!well-known(?:/|$)) { deny all; }
    location ~* \.(?:env|ini|conf|ya?ml|properties|sql|bak|backup|old|orig|save|swp|swo|log|pem|key|p12|pfx|jks|keystore|zip|tar|gz|tgz|7z|rar)(?:/|$) { deny all; }
    location ~ ~$ { deny all; }

    # === SPEC-0001 gzip ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    location = /MKJ { return 301 /MKJ/; }
    location /MKJ/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /MKJ/index.html;
    }

    location = /dd {
        return 301 /dd/;
    }

    location /dd/api/ {
        proxy_pass http://127.0.0.1:3310/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_cookie_path /api/auth /dd/api/auth;
    }
    # 蛋蛋世界后端 API：/api/* → 本地 8090 的 /api/*（前端已部署在根路径 /）
    # 精确的较长前缀只限制认证接口；其他 /api/ 请求不消耗此 zone。
    location /api/auth/ {
        limit_req zone=eggworld_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 宿舍图片上传：最多 5 张 × 5 MB，放宽请求体上限但不影响其他 API。
    location = /api/dormitories {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8090/api/dormitories;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 原根路径项目（Node，localhost:3000）→ 现挪到 /xs/ =====
    location = /xs { return 301 /xs/; }
    location /xs/ {
        # 末尾的 / 会剥掉 /xs 前缀，使该应用收到的路径与原先挂在 / 时保持一致
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

location = /dd/health { proxy_pass http://127.0.0.1:3310/health; proxy_set_header Host $host; }
    location = /dd/blind-box { return 301 /dd/blind-box/; }
location /dd/blind-box/ { alias /var/www/dd/blind-box/; index index.html; }

location /dd/ {
        index growth-school.html;
        root /var/www;
        try_files $uri $uri/ /dd/growth-school.html;
        expires $dd_static_expires;   # SPEC-0001
    }
    # ===== 蛋蛋世界（根路径 /）=====
    # 前端静态文件：index.html + 角色图片 + onboarding-guide.js/css 均在 /home/xiaos/eggworld/xs/
    #
    # /rs/（简历站 + 职业测评）：HTML 与目录索引是发版入口，必须每次重新校验；
    # 带 hash / ?v= 的 js、css、图片继续长缓存。
    # 2026-10-21 实测：/rs/career/ 曾返回 max-age=604800，发版后用户 7 天内拿不到新页面。
    location ~* ^/rs/.*\.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|map)$ {
        root /home/xiaos/eggworld/xs;
        expires 7d;
    }
    location /rs/ {
        root /home/xiaos/eggworld/xs;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
    }

    location / {
        root /home/xiaos/eggworld/xs;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 静态资源（图片/JS/CSS）长缓存，回访不再重新下载
        expires 7d;
        access_log off;
    }

    # 入口 HTML 不缓存：保证每次发版即时生效（浏览器仍会用 ETag 协商，命中则 304）
    location = /index.html {
        root /home/xiaos/eggworld/xs;
        expires -1;
    }
}
