<!DOCTYPE html>
<html class="dark" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>职业测评答题页</title>
    <link href="../favicon.ico" rel="shortcut icon" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet" />
    <link href="../css/output.css?v=20261021a" rel="stylesheet" />
    <link href="../css/career.css?v=20261021a" rel="stylesheet" type="text/css; charset=utf-8" />
    <link href="../css/career-theme.css?v=20261021a" rel="stylesheet" type="text/css; charset=utf-8" />
    <link href="../css/career-report.css?v=20261021g" rel="stylesheet" type="text/css; charset=utf-8" />
    <link href="../css/markdown.css?v=20261021a" rel="stylesheet" type="text/css; charset=utf-8" />
    <link href="../css/navigation-feedback.css?v=20261021a" rel="stylesheet" />
    <link href="../css/mobile-adaptation.css?v=20261021a" rel="stylesheet" />
    <script src="../js/career-dialog.js?v=20261021a"></script>
    <script src="../js/report-share.js?v=20261021c"></script>
    <script src="../js/career.js?v=20261021d" charset="utf-8"></script>
    <script src="../js/navigation-feedback.js?v=20261021a" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="../js/icon-font-guard.js?v=20261020d"></script>
</head>

<body class="career-question-page bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white transition-colors duration-200"
    onload="init()">
    <div class="relative flex min-h-screen flex-col">
        <header
            class="sticky top-0 z-50 w-full border-b border-solid border-[#f0f2f4] dark:border-gray-800 bg-white dark:bg-background-dark px-6 md:px-20 py-3">
            <div class="mx-auto flex max-w-[1280px] items-center justify-between">
                <div class="flex items-center gap-3 md:gap-4">
                    <a href="../index.html" aria-label="返回找方向首页"
                        class="flex items-center gap-1 rounded-lg px-2 py-1 text-sm font-medium text-gray-500 transition-colors hover:text-primary">
                        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
                        <span>返回</span>
                    </a>
                    <div class="flex size-10 items-center justify-center rounded-lg bg-primary text-white">
                        <span class="material-symbols-outlined">rocket_launch</span>
                    </div>
                    <h2 class="text-lg font-bold leading-tight tracking-tight">大师兄牛啵</h2>
                </div>
                <div class="flex items-center gap-4 md:gap-6">
                    <a href="../reports.html" class="text-sm font-bold text-primary hover:underline">我的报告</a>
                    <div
                        class="h-10 w-10 p-1 rounded-full bg-primary/10 border-2 border-primary flex items-center justify-center overflow-hidden">
                        <img alt="用户头像" class="h-full w-full object-contain" src="../images/default-avatar.png" />
                    </div>
                </div>
            </div>
        </header>
        <main id="main" class="mx-auto flex w-full max-w-[1280px] flex-1 flex-col gap-6 px-6 py-8 md:px-20">
            <div class="w-full rounded-2xl bg-white dark:bg-gray-900 p-6 shadow-sm">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">analytics</span>
                            <p class="text-base font-semibold">测评进度</p>
                        </div>
                        <p id="progress-percentage" class="text-sm font-medium text-primary">0%</p>
                    </div>
                    <div class="h-3 w-full rounded-full bg-gray-100 dark:bg-gray-800">
                        <div id="progress-bar" class="h-3 rounded-full bg-primary transition-all duration-500"
                            style="width: 0%;"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <p id="progress-bar-text" class="text-sm text-gray-500 dark:text-gray-400">已完成 0/? 题</p>
                        <p id="remain-time" class="text-sm text-gray-500 dark:text-gray-400">预计还需 ? 分钟</p>
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-6 lg:flex-row">
                <aside class="w-full lg:w-72 shrink-0">
                    <div class="sticky top-24 flex flex-col gap-4 rounded-2xl bg-white dark:bg-gray-900 p-6 shadow-sm">
                        <div class="border-b border-gray-100 dark:border-gray-800 pb-4">
                            <h3 class="text-base font-bold">题目列表</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">共 <span
                                    id="list-question-number">0</span> 道题目</p>
                        </div>
                        <div id="question-list-scroll" class="max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                            <div id="question-list"
                                class="grid grid-cols-5 gap-2 lg:flex lg:flex-col lg:gap-2">
                            </div>
                        </div>
                    </div>
                </aside>
                <div class="flex-1">
                    <div class="flex h-full flex-col gap-6 rounded-2xl bg-white dark:bg-gray-900 p-8 shadow-sm">
                        <div class="space-y-2">
                            <span id="question-part-id-text"
                                class="inline-block px-3 py-1 rounded-full bg-primary/10 text-primary text-xs font-bold uppercase tracking-wider">Part
                                X: XXX</span>
                            <h2 id="question-stem" class="text-2xl md:text-3xl font-bold leading-snug tracking-tight">第
                                X 题：XXX</h2>
                        </div>
                        <div id="question-options" class="flex flex-col gap-4 py-4 radio-dot-svg"></div>
                        <div
                            class="mt-auto flex items-center justify-between pt-8 border-t border-gray-100 dark:border-gray-800">
                            <button id="previous-button" onclick="previousQuestion()"
                                class="flex items-center gap-2 px-6 py-3 rounded-xl border border-gray-200 dark:border-gray-700 font-bold hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
                                <span class="material-symbols-outlined">arrow_back</span>
                                上一题
                            </button>
                            <button id="next-button" onclick="nextQuestion()"
                                class="flex items-center gap-2 px-8 py-3 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
                                下一题
                                <span class="material-symbols-outlined">arrow_forward</span>
                            </button>
                        </div>
                        <p id="charge-hint" class="mt-3 text-center text-xs text-gray-500 dark:text-gray-400"></p>
                    </div>
                </div>
            </div>
        </main>
        <!-- Footer / Security -->
        <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-12 bg-white dark:bg-background-dark">
            <div class="max-w-[1200px] mx-auto px-6 lg:px-40">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                    <div class="flex items-center gap-2 opacity-50">
                        <p class="text-sm">© 2026 大师兄牛啵. All rights reserved.</p>
                    </div>
                    <div class="flex gap-8">
                        <span class="text-sm text-slate-500">隐私政策</span>
                        <span class="text-sm text-slate-500">服务条款</span>
                        <span class="text-sm text-slate-500">联系我们</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
